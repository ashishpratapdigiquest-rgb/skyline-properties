name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'skyline-backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'skyline-backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyline-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check app imports correctly
        run: python -c "import main; print('App loaded OK')"
